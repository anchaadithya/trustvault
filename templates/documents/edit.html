{% extends "base.html" %}
{% block content %}
<h1 class="h3">Edit “{{ doc.name }}”</h1>
<form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">{% csrf_token %}{{ form.as_p }}
<p class="text-muted small">Replacement files are validated exactly like uploads (PDF, PNG, JPG, TXT, max 5 MB).</p>
<div><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{% url 'document_detail' doc.pk %}">Cancel</a></div></form>
{% endblock %}
