
{% extends "base.html" %}

{% block title %}Edit Document · TrustVault{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3 mb-3">Edit "{{ doc.name }}"</h1>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                <p class="text-muted small">
                    Replacement files are validated like uploads:
                    PDF, PNG, JPG, JPEG or TXT, maximum 5 MB.
                </p>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a class="btn btn-link"
                       href="/documents/{{ request.resolver_match.kwargs.pk }}/">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
